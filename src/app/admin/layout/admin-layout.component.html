<div class="admin-shell">
  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="title">Administration</div>
      <div class="subtitle">Navigation</div>
    </div>

    <nav class="sidebar-nav">
      <a
        routerLink="/admin/tableau-de-bord"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3v18h18" />
            <path d="M7 14l3-3 4 4 6-8" />
          </svg>
        </span>
        <span>Dashboard</span>
      </a>

      <a *ngIf="isAdmin" routerLink="/admin/utilisateurs" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </span>
        <span>Utilisateurs</span>
      </a>

      <a *ngIf="isAdmin" routerLink="/admin/entreprises" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 21V7a2 2 0 0 1 2-2h6v16" />
            <path d="M13 21V3h6a2 2 0 0 1 2 2v16" />
            <path d="M7 9h2" />
            <path d="M7 13h2" />
            <path d="M17 9h2" />
            <path d="M17 13h2" />
          </svg>
        </span>
        <span>Entreprises</span>
      </a>

      <a *ngIf="isAdmin" routerLink="/admin/representants" routerLinkActive="active" class="nav-item">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </span>
        <span>Représentants</span>
      </a>

      <a
        *ngIf="isAdmin || isResponsableStages"
        routerLink="/admin/demandes-stage"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg>
        </span>
        <span>Demandes (validation)</span>
      </a>
    </nav>
  </aside>
</div>
