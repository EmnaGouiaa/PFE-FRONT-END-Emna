<div class="enquete-page" [class.enquete-page--wide]="wide">

  <header class="enq-hero">
    <div class="enq-hero__content">
      <div class="enq-hero__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="28" height="28">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <path d="M9 5a3 3 0 0 1 6 0"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h1 class="enq-hero__title">Enquête de satisfaction</h1>
        <p class="enq-hero__subtitle">{{ subtitle }}</p>
      </div>
    </div>
    <button
      type="button"
      class="enq-btn enq-btn--secondary"
      (click)="onRefresh()"
      [disabled]="isLoading"
    >
      Actualiser
    </button>
  </header>

  <div class="enq-loading" *ngIf="isLoading">
    <span class="enq-spinner" aria-hidden="true"></span>
    Vérification de la période d'accès...
  </div>

  <div class="enq-alert enq-alert--error" *ngIf="!isLoading && errorMessage" role="alert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8v4M12 16h.01"/>
    </svg>
    {{ errorMessage }}
  </div>

  <div class="enq-body" *ngIf="!isLoading && !errorMessage">
    <ng-content></ng-content>
  </div>

</div>
