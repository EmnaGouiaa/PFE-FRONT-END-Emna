<li class="nav-item notification-bell-container" style="position:relative;">
  <!-- Bell button -->
  <button
    class="btn btn-link nav-link p-1 position-relative"
    style="color:rgba(255,255,255,.85);"
    (click)="toggleDropdown($event)"
    title="Notifications"
    aria-label="Notifications"
  >
    <i class="fas fa-bell fa-lg"></i>
    <span
      *ngIf="unreadCount > 0"
      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
      style="font-size:0.65rem; min-width:18px; padding:2px 5px;"
    >{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
  </button>

  <!-- Dropdown -->
  <div
    *ngIf="isOpen"
    class="dropdown-menu dropdown-menu-end show shadow"
    style="min-width:340px; max-width:380px; right:0; left:auto; position:absolute; z-index:1050; padding:0;"
  >
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom bg-light">
      <span class="fw-semibold" style="font-size:0.9rem;">
        Notifications
        <span *ngIf="unreadCount > 0" class="badge bg-danger ms-1" style="font-size:0.7rem;">{{ unreadCount }}</span>
      </span>
      <button
        *ngIf="unreadCount > 0"
        class="btn btn-link btn-sm p-0 text-primary"
        style="font-size:0.75rem; text-decoration:none;"
        [disabled]="markingAll"
        (click)="markAllAsRead($event)"
      >{{ markingAll ? 'En cours...' : 'Tout marquer lu' }}</button>
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading" class="text-center py-3">
      <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!isLoading && notifications.length === 0" class="text-center py-4 text-muted" style="font-size:0.85rem;">
      <i class="fas fa-bell-slash mb-2 d-block fa-lg"></i>
      Aucune notification
    </div>

    <!-- List -->
    <ul *ngIf="!isLoading && notifications.length > 0" class="list-unstyled mb-0" style="max-height:380px; overflow-y:auto;">
      <li
        *ngFor="let n of shownNotifications"
        class="px-3 py-2 border-bottom notification-item"
        [class.bg-light]="!n.read"
        style="cursor:pointer; transition:background 0.15s;"
        (click)="openNotification(n, $event)"
      >
        <div class="d-flex align-items-start gap-2">
          <!-- Icon -->
          <div class="mt-1 flex-shrink-0">
            <i
              class="fas"
              [class.fa-check-circle]="n.type && n.type.includes('VALID')"
              [class.fa-times-circle]="n.type && n.type.includes('REFUS')"
              [class.fa-user-check]="n.type && n.type.includes('AFFECTATION')"
              [class.fa-exchange-alt]="n.type && n.type.includes('MODIFICATION')"
              [class.fa-file-alt]="n.type && n.type.includes('RAPPORT')"
              [class.fa-clipboard-list]="n.type && n.type.includes('ENQUETE')"
              [class.fa-sync-alt]="n.type && n.type.includes('STATUT')"
              [class.fa-bell]="!n.type || (!n.type.includes('VALID') && !n.type.includes('REFUS') && !n.type.includes('AFFECTATION') && !n.type.includes('MODIFICATION') && !n.type.includes('RAPPORT') && !n.type.includes('ENQUETE') && !n.type.includes('STATUT'))"
              [style.color]="n.read ? '#6c757d' : '#0d6efd'"
              style="font-size:0.9rem;"
            ></i>
          </div>

          <!-- Content -->
          <div class="flex-grow-1 overflow-hidden">
            <div class="d-flex align-items-center justify-content-between gap-1 mb-1">
              <span class="fw-semibold text-truncate" style="font-size:0.82rem; max-width:200px;">{{ n.title }}</span>
              <span class="badge rounded-pill" [ngClass]="getTypeClass(n.type)" style="font-size:0.65rem; flex-shrink:0;">
                {{ getTypeLabel(n.type) }}
              </span>
            </div>
            <p class="mb-1 text-muted" style="font-size:0.78rem; line-height:1.3; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
              {{ n.message }}
            </p>
            <div class="d-flex align-items-center justify-content-between">
              <span class="text-muted" style="font-size:0.7rem;">{{ formatDate(n.dateTime) }}</span>
              <button
                *ngIf="!n.read"
                class="btn btn-link btn-sm p-0"
                style="font-size:0.7rem; text-decoration:none;"
                [disabled]="markingId === n.id"
                (click)="markAsRead(n, $event)"
              >{{ markingId === n.id ? '...' : 'Marquer lu' }}</button>
              <span *ngIf="n.read" class="text-success" style="font-size:0.7rem;">
                <i class="fas fa-check"></i> Lu
              </span>
            </div>
          </div>
        </div>
      </li>
    </ul>

    <!-- Footer link -->
    <div *ngIf="!isLoading && notifications.length > 0" class="text-center py-2 border-top bg-light">
      <button
        class="btn btn-link btn-sm p-0 text-primary"
        style="font-size:0.8rem; text-decoration:none;"
        (click)="navigateToAll($event)"
      >Voir toutes les notifications <i class="fas fa-arrow-right ms-1"></i></button>
    </div>
  </div>
</li>
